
ame: Build APK  # 工作流名称
on: [push]       # 触发条件：当你推送代码时自动运行

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Ubuntu 云主机
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        
      - name: 设置 JDK 环境
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: 赋予 Gradle 执行权限
        run: chmod +x ./gradlew
        
      - name: 打包 Debug 版 APK
        run: ./gradlew assembleDebug  # 执行打包命令
        
      - name: 上传生成的 APK
        uses: actions/upload-artifact@v4  # 将打包好的文件保存起来供你下载
        with:
          name: my-app-apk
          path: app/build/outputs/apk/debug/dgdg.apk
